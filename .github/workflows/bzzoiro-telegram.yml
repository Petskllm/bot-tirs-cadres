name: Pronostics Bzzoiro vers Telegram

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Envoyer le message Telegram (décocher pour un dry-run sans publication)"
        required: false
        type: boolean
        default: true
      track_only:
        description: "Enregistrer/régler les pronostics sans envoyer Telegram"
        required: false
        type: boolean
        default: false
      persist_history:
        description: "Pousser data/ sur la branche lancée pour conserver l'historique de calibration"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bzzoiro-telegram
  cancel-in-progress: false

jobs:
  run-bzzoiro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier les secrets requis
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SEND_TELEGRAM: ${{ inputs.send_telegram }}
          TRACK_ONLY: ${{ inputs.track_only }}
        run: |
          set -euo pipefail
          test -n "$BZZOIRO_TOKEN" || { echo "Secret BZZOIRO_TOKEN manquant"; exit 1; }
          if [ "$SEND_TELEGRAM" = "true" ] && [ "$TRACK_ONLY" != "true" ]; then
            test -n "$TELEGRAM_TOKEN" || { echo "Secret TELEGRAM_TOKEN manquant"; exit 1; }
            test -n "$CHAT_ID" || { echo "Secret CHAT_ID manquant"; exit 1; }
          fi
      - name: Tests hors ligne
        run: python -m unittest -v test_pure_functions.py test_bot_modes.py test_sportapi_bot.py test_sportapi_dry_run_preflight.py test_api_football_fallback.py test_tracking_api_football.py test_probability_model.py
      - name: Générer les pronostics Bzzoiro
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DRY_RUN: ${{ !inputs.send_telegram || inputs.track_only }}
          TRACK_ONLY: ${{ inputs.track_only }}
        run: python test_bzzoiro.py
      - name: Persister l'historique de calibration sur la branche
        if: ${{ inputs.persist_history }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Enregistre le suivi des pronostics Bzzoiro"
            git push
          else
            echo "Aucune modification de suivi à pousser."
          fi
      - name: Archiver le suivi et la calibration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bzzoiro-suivi-${{ github.run_id }}
          path: |
            data/predictions.jsonl
            data/market_report.json
            data/calibration.json
          if-no-files-found: ignore
          retention-days: 30
