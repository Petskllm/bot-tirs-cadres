name: Pronostics Telegram

env:
  PUBLISH_TEAM_SOT: "1"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bzzoiro-telegram
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier les secrets requis
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$BZZOIRO_TOKEN" ] && [ -z "$API_FOOTBALL_KEY" ] && [ -z "$SPORTAPI_KEY" ]; then
            echo "Aucun fournisseur configuré (BZZOIRO_TOKEN, API_FOOTBALL_KEY, SPORTAPI_KEY absents)"
            exit 1
          fi
          test -n "$TELEGRAM_TOKEN" || { echo "Secret TELEGRAM_TOKEN manquant"; exit 1; }
          test -n "$CHAT_ID" || { echo "Secret CHAT_ID manquant"; exit 1; }
      - name: Tests automatiques hors ligne
        run: python -m unittest -v test_pure_functions.py test_bot_modes.py test_sportapi_bot.py test_sportapi_dry_run_preflight.py test_api_football_fallback.py test_tracking_api_football.py test_probability_model.py test_provider_cascade.py
      - name: Essayer Bzzoiro
        id: bzzoiro
        continue-on-error: true
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DRY_RUN: "false"
          TRACK_ONLY: "false"
          ENABLE_SOURCE_FALLBACK: "1"
        run: python test_bzzoiro.py
      - name: Essayer API-Football si aucune sélection Bzzoiro n’est exploitable
        id: api_football
        if: ${{ !cancelled() && steps.bzzoiro.outputs.has_predictions != 'true' }}
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_FALLBACK: "true"
          API_FOOTBALL_MAX_REQUESTS: "35"
          DRY_RUN: "false"
          TRACK_ONLY: "false"
          ENABLE_SOURCE_FALLBACK: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_sportapi.py
      - name: Précontrôler le quota SportAPI si les autres sources échouent
        id: sportapi_preflight
        if: ${{ !cancelled() && steps.bzzoiro.outputs.has_predictions != 'true' && steps.api_football.outputs.has_predictions != 'true' }}
        continue-on-error: true
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: python sportapi_dry_run_preflight.py
      - name: Essayer SportAPI si aucune source précédente n’est exploitable
        if: ${{ !cancelled() && steps.bzzoiro.outputs.has_predictions != 'true' && steps.api_football.outputs.has_predictions != 'true' && steps.sportapi_preflight.outcome == 'success' }}
        continue-on-error: true
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
          DRY_RUN: "false"
          TRACK_ONLY: "false"
          ENABLE_SOURCE_FALLBACK: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_sportapi.py
      - name: Persister automatiquement le suivi
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Enregistre le suivi des pronostics"
            git push
          else
            echo "Aucune modification de suivi à pousser."
          fi
      - name: Archiver le suivi et la calibration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suivi-pronostics-${{ github.run_id }}
          path: |
            data/predictions.jsonl
            data/market_report.json
            data/calibration.json
          if-no-files-found: ignore
          retention-days: 30
