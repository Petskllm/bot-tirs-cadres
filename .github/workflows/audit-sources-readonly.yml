name: Audit comparatif des sources (lecture seule)

on:
  workflow_dispatch:
    inputs:
      audit_date:
        description: "Date UTC des matchs terminés à comparer (YYYY-MM-DD)"
        required: true
        type: string
      max_matches:
        description: "Nombre maximal de matchs communs (1 ou 2)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
        default: "1"

permissions:
  contents: read

concurrency:
  group: audit-sources-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer la dépendance HTTP
        run: python -m pip install requests
      - name: Tester l’audit hors ligne
        run: python -m unittest -v test_compare_all_sources_readonly.py
      - name: Comparer les sources (GET uniquement)
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
        run: python compare_all_sources_readonly.py --date "${{ inputs.audit_date }}" --max-matches "${{ inputs.max_matches }}"
