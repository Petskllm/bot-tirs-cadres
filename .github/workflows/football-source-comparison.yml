name: Bzzoiro vs SportAPI read-only comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-source-readonly-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Comparer Bzzoiro et SportAPI sur les mêmes matchs terminés
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: python compare_sportapi_bzzoiro.py
