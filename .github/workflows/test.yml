name: Backtest temporaire SportAPI — règles actuelles
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Champ conservé pour compatibilité du déclenchement manuel"
        required: false
        type: boolean
        default: true
      track_only:
        description: "Champ conservé pour compatibilité du déclenchement manuel"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sportapi-rules-walkforward
  cancel-in-progress: false
jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer la branche temporaire
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances existantes
        run: python -m pip install -r requirements.txt
      - name: Simuler les règles actuelles en walk-forward
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: >-
          python sportapi_rules_walkforward.py
          --end-date 2026-11-25
          --test-days 27
          --lookback-days 120
          --max-requests 700
          --minimum-reset-quota 699
      - name: Joindre uniquement les agrégats
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sportapi-rules-walkforward-summary-${{ github.run_id }}
          path: |
            reports/sportapi_rules_walkforward_summary.json
            reports/sportapi_rules_walkforward_summary.md
          if-no-files-found: warn
          retention-days: 7
