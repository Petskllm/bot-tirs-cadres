name: Bot pronostics SportAPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser et afficher les pronostics sans envoyer Telegram"
        required: false
        type: boolean
        default: true
      track_only:
        description: "Enregistrer/régler les pronostics sans envoyer Telegram"
        required: false
        type: boolean
        default: false
      api_football_diagnostic:
        description: "Tester la couverture API-Football sans pronostic ni Telegram"
        required: false
        type: boolean
        default: false
      source_comparison:
        description: "Comparer tirs et corners Bzzoiro/API-Football sur 5 matchs maximum"
        required: false
        type: boolean
        default: false
      api_football_stats:
        description: "Analyser tirs, corners et cartons via API-Football uniquement"
        required: false
        type: boolean
        default: false
      api_football_fallback:
        description: "Tester le fournisseur de secours API-Football en dry-run uniquement"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot-tirs-cadres
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tester le suivi et les modes sans effets externes
        run: python -m unittest -v test_pure_functions.py test_bot_modes.py test_sportapi_bot.py test_sportapi_dry_run_preflight.py test_api_football_fallback.py test_tracking_api_football.py test_probability_model.py test_provider_cascade.py
      - name: Contrôler le quota SportAPI avant le bot
        if: ${{ !inputs.source_comparison && !inputs.api_football_stats && !inputs.api_football_diagnostic && !inputs.api_football_fallback }}
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: python sportapi_dry_run_preflight.py
      - name: Exécuter le bot SportAPI
        if: ${{ !inputs.source_comparison && !inputs.api_football_stats && !inputs.api_football_diagnostic && !inputs.api_football_fallback }}
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          TRACK_ONLY: ${{ inputs.track_only || false }}
        run: python bot_sportapi.py
      - name: Tester le secours API-Football (sans Telegram ni écriture)
        if: ${{ inputs.api_football_fallback }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_FALLBACK: "true"
          API_FOOTBALL_MAX_REQUESTS: "35"
          DRY_RUN: "true"
          TRACK_ONLY: "false"
        run: python bot_sportapi.py
      - name: Diagnostic API-Football historique (optionnel)
        if: ${{ inputs.api_football_diagnostic && !inputs.api_football_fallback }}
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_DIAGNOSTIC: "true"
        run: python test_bzzoiro.py
      - name: Comparer la couverture des sources
        if: ${{ inputs.source_comparison && !inputs.api_football_fallback }}
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python compare_sources.py --max-matches 5
      - name: Analyser les statistiques API-Football uniquement
        if: ${{ inputs.api_football_stats && !inputs.api_football_fallback }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_only_stats.py --max-matches 5
      - name: Persister les résultats et rapports
        if: ${{ (!inputs.dry_run || inputs.track_only) && !inputs.api_football_diagnostic && !inputs.source_comparison && !inputs.api_football_stats && !inputs.api_football_fallback }}
        run: |
          if [ -d data ] && [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Met à jour le suivi et la calibration"
            git push
          else
            echo "Aucune nouvelle donnée de suivi à publier."
          fi
