name: Bot tirs cadrés

on:
  schedule:
    # Exécution quotidienne à 18:00 UTC.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser et afficher les pronostics sans envoyer Telegram"
        required: false
        type: boolean
        default: false
      api_football_diagnostic:
        description: "Tester la couverture API-Football sans pronostic ni Telegram"
        required: false
        type: boolean
        default: false
      source_comparison:
        description: "Comparer tirs et corners Bzzoiro/API-Football sur 5 matchs maximum"
        required: false
        type: boolean
        default: false
      api_football_stats:
        description: "Analyser tirs, corners et cartons via API-Football uniquement"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot-tirs-cadres
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Exécuter le bot
        if: ${{ !inputs.source_comparison && !inputs.api_football_stats }}
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          API_FOOTBALL_DIAGNOSTIC: ${{ inputs.api_football_diagnostic || false }}
        run: python test_bzzoiro.py
      - name: Comparer la couverture des sources
        if: ${{ inputs.source_comparison }}
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python compare_sources.py --max-matches 5
      - name: Analyser les statistiques API-Football uniquement
        if: ${{ inputs.api_football_stats }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python api_only_stats.py --max-matches 5
      - name: Persister les résultats et rapports
        if: ${{ !inputs.dry_run && !inputs.api_football_diagnostic && !inputs.source_comparison && !inputs.api_football_stats }}
        run: |
          if [ -d data ] && [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Met à jour le suivi et la calibration"
            git push
          else
            echo "Aucune nouvelle donnée de suivi à publier."
          fi
