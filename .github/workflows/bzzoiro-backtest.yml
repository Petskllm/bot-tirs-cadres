name: Backtest et calibration Bzzoiro

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Début de la période historique (AAAA-MM-JJ)"
        required: true
        type: string
      end_date:
        description: "Fin de la période historique (AAAA-MM-JJ)"
        required: true
        type: string
      max_matches:
        description: "Nombre maximal de matchs terminés à rejouer"
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier le jeton API
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
        run: test -n "$BZZOIRO_TOKEN" || { echo "Secret BZZOIRO_TOKEN manquant"; exit 1; }
      - name: Rejouer les matchs historiques
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MAX_MATCHES: ${{ inputs.max_matches }}
        run: >-
          python backtest_bzzoiro.py
          --start "$START_DATE"
          --end "$END_DATE"
          --max-matches "$MAX_MATCHES"
          --output bzzoiro_backtest.csv
      - name: Télécharger les résultats
        uses: actions/upload-artifact@v4
        with:
          name: bzzoiro-backtest-${{ github.run_id }}
          path: |
            bzzoiro_backtest.csv
            bzzoiro_backtest_summary.json
          if-no-files-found: error
          retention-days: 30
