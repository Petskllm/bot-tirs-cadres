name: SportAPI.ai 30-day audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportapi-readonly-diagnostic
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Analyser la couverture SportAPI.ai sur 30 jours
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: python sportapi_30day_audit.py
