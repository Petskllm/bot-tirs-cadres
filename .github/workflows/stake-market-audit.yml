name: Audit des marchés Stake

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Fenêtre d’inventaire des matchs à venir"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "7"
          - "14"
        default: "7"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer requests
        run: python -m pip install requests
      - name: Tests hors ligne de l’audit Stake
        run: python -m unittest -v test_stake_market_audit.py
      - name: Relever les marchés Stake ouverts
        env:
          STAKE_SPORTSBOOK_API_KEY: ${{ secrets.STAKE_SPORTSBOOK_API_KEY }}
          STAKE_DAYS_AHEAD: ${{ inputs.days_ahead }}
          STAKE_REPORT_PATH: stake_market_inventory.json
        run: python stake_market_audit.py
      - name: Archiver l’inventaire
        uses: actions/upload-artifact@v4
        with:
          name: stake-market-inventory-${{ github.run_id }}
          path: stake_market_inventory.json
          if-no-files-found: error
          retention-days: 14
